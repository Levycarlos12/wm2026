<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026</title>

    <link rel="stylesheet" href="finalphase.css">
    <link rel="icon" type="image/avif" href="./img/tironda.avif">

<body>
    <div class="main-container">

        <header class="main-header">
            <div class="logo">
                <a href="index.html">FIFA WORLD CUP <span>2026</span></a>
            </div>

            <button class="menu-toggle" id="menu-toggle" aria-label="Ouvrir le menu">
                ☰
            </button>

            <nav class="main-nav">
                <ul class="nav-list" id="js-nav-list">
                    <li><a href="index.html" class="active">HOME</a></li>
                    <li><a href="Spielplan.html">MATCHES</a></li>
                      <li><a href="info.html">GESCHICHTE</a></li>
                    <li><a href="games.html">QUIZ</a></li>
                   
                </ul>
            </nav>
        </header>

        <section class="page-title">
            <h1>FIFA WORLD CUP 2026</h1>
            <p>11.06.2026 - 19.07.2026</p>
            <p>USA • KANADA • MEXIKO</p>
        </section>

        <div class="content-grid">

            <aside class="column-groups">
                <div class="group-card" data-group="A"></div>
                <div class="group-card" data-group="B"></div>
                <div class="group-card" data-group="C"></div>
                <div class="group-card" data-group="D"></div>
                <div class="group-card" data-group="E"></div>
                <div class="group-card" data-group="F"></div>
            </aside>

            <main class="center-stage">
                <section class="map-section">
                   
                </section>

                <section class="knockout-stage">
                    <div class="ko-row finale">
                        <h2>FINALE</h2>
                        <div class="match-slot big"></div>
                    </div>

                    <div class="ko-row halbfinale">
                        <h2>HALBFINALE</h2>
                        <div class="slots">
                            <div class="match-slot"></div>
                            <div class="match-slot"></div>
                        </div>
                    </div>

                    <div class="ko-row viertelfinale">
                        <h2>VIERTELFINALE</h2>
                        <div class="slots">
                            <div class="match-slot"></div>
                            <div class="match-slot"></div>
                            <div class="match-slot"></div>
                            <div class="match-slot"></div>
                        </div>
                    </div>

                    <div class="ko-row achtelfinale">
                        <h2>ACHTELFINALE</h2>
                        <div class="slots-grid-8"></div>
                    </div>

                    <div class="ko-row sechzehntelfinale">
                        <h2>SECHZEHNTELFINALE</h2>
                        <div class="slots-grid-16"></div>
                    </div>
                </section>

                <footer class="sponsor-banner">
                    <div class="hs-logo">FBI</div>
                    <div class="getraenke-text">HS Worms</div>
                </footer>
            </main>

            <aside class="column-groups">
                <div class="group-card" data-group="G"></div>
                <div class="group-card" data-group="H"></div>
                <div class="group-card" data-group="I"></div>
                <div class="group-card" data-group="J"></div>
                <div class="group-card" data-group="K"></div>
                <div class="group-card" data-group="L"></div>
            </aside>

        </div>
