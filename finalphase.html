<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA WORLD CUP  2026</title>
    <link rel="stylesheet" href="finalphase.css">
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header class="site-header">
            <nav class="nav-container" aria-label="Navigation principale">
                  <div class="logo">
                <a href="index.html"> FIFA WORLD CUP <span class="year">2026</span></a>
            </div>

                <button id="menu-toggle" class="nav-button" aria-expanded="false" aria-controls="menu">
                    <span class="icon">☰</span>
                    <span class="sr-only">Navigationsmenü öffnen</span>
                </button>

                <ul id="menu" class="nav-menu" hidden>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="info.html">Geschichte</a></li>
                    <li><a href="Quiz.html">Quiz</a></li>
                  
                </ul>
            </nav>
        </header>

        <div class="content-grid">
            
            <aside class="column-groups">
                <div class="group-card" data-group="A"></div>
                <div class="group-card" data-group="B"></div>
                <div class="group-card" data-group="C"></div>
                <div class="group-card" data-group="D"></div>
                <div class="group-card" data-group="E"></div>
                <div class="group-card" data-group="F"></div>
            </aside>


            
            <main class="center-stage">
             <!--   <section class="tournament-info">
                    <div class="-stadien-card">

                        <img src="stadien.png" alt="Stadien" class="stadien-image">
                    </div>
                       
                </section>
                -->
                
                <div class="map-section">
                    <div class="stadien-card">
                    <img src="stadien.png" alt="Stadien" class="stadien-image">
                    </div>
                </div>

                <div class="knockout-stage">
                    <div class="ko-row finale">
                        <h3>FINALE</h3>
                        <div class="match-slot big"></div>
                    </div>
                    <div class="ko-row halbfinale">
                        <h3>HALBFINALE</h3>
                        <div class="slots"><div class="match-slot"></div><div class="match-slot"></div></div>
                    </div>
                    <div class="ko-row viertelfinale">
                        <h3>VIERTELFINALE</h3>
                        <div class="slots"><div class="match-slot"></div><div class="match-slot"></div><div class="match-slot"></div><div class="match-slot"></div></div>
                    </div>
                    <div class="ko-row achtelfinale">
                        <h3>ACHTELFINALE</h3>
                        <div class="slots-grid-8"></div>
                    </div>
                    <div class="ko-row sechzehntelfinale">
                        <h3>SECHZEHNTELFINALE</h3>
                        <div class="slots-grid-16"></div>
                    </div>
                </div>

                <footer class="sponsor-banner">
                    <div class="fristo-logo">FBI</div>
                    <div class="getraenke-text">HS Worms</div>
                </footer>
            </main>

            <aside class="column-groups">
                <div class="group-card" data-group="G"></div>
                <div class="group-card" data-group="H"></div>
                <div class="group-card" data-group="I"></div>
                <div class="group-card" data-group="J"></div>
                <div class="group-card" data-group="K"></div>
                <div class="group-card" data-group="L"></div>
            </aside>

        </div>
    </div>

    <script src="finalphase.js"></script>
