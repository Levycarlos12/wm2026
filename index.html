<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 - Offizielle Plattform</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-container">
        
        <header class="site-header">
            <nav class="nav-container" aria-label="Hauptnavigation">
                <div class="site-logo">
                    FIFA <span class="logo-highlight">2026</span>
                </div>

                <button id="menu-toggle" class="nav-button" aria-expanded="false" aria-controls="menu">
                    <span class="icon">☰</span>
                    <span class="sr-only">Navigationsmenü öffnen</span>
                </button>

                <ul id="menu" class="nav-menu" hidden>
                    
                    <li><a href="Spielplan.html">Spielplan</a></li>
                    <li><a href="info.html">About</a></li>
                    <li><a href="Quiz.html">Quiz</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </header>

        <main class="hero-content">
            <div class="hero-inner">
                <h1 class="badge-promo">WELCOME TO THE FIFA FOOTBALL WORLDCUP 2026</h1>
                
                <h1 class="hero-title">
                    UNITED FOR THE <br>
                    <span class="text-neon">GREATEST</span> GAME
                </h1>
                
               

                <div class="action-controls">
                    <a href="tickets.html" class="btn btn-primary">
                        <span class="icon">🎫</span> GET TICKETS
                    </a>
                    <button id="watch-teaser" type="button" class="btn btn-secondary">
                        <span class="icon">▶</span> WATCH TEASER
                    </button>
                </div>
            </div>
        </main>

        <section class="info-grid" aria-label="Informationen und Services">
            
            <button type="button" onclick="location.href='Spielplan.html'" class="card-button" aria-label="Zum Spielplan wechseln">
                <article class="info-card">
                    <div class="card-icon icon-blue" aria-hidden="true">
                        <span class="icon">📅</span>
                    </div>
                    <div class="card-text">
                        <h2>SPIELPLAN</h2>
                        <p>Verpassen Sie kein Match: Alle Termine, Gruppen und Stadien der WM 2026 im Überblick.</p>
                    </div>
                </article>
            </button>

            <button type="button" onclick="location.href='info.html'" class="card-button" aria-label="Zu den Informationen wechseln">
                <article class="info-card">
                    <div class="card-icon icon-neon-bg" aria-hidden="true">
                        <span class="icon">📍</span>
                    </div>
                    <div class="card-text">
                        <h2>INFO</h2>
                        <p>Alles über die Austragungsorte, das neue Turniersystem und die Teams der Weltmeisterschaft.</p>
                    </div>
                </article>
            </button>

            <button type="button" onclick="location.href='Quiz.html'" class="card-button" aria-label="Zum Quiz wechseln">
                <article class="info-card">
                    <div class="card-icon icon-gray" aria-hidden="true">
                        <span class="icon">🛍️</span>
                    </div>
                    <div class="card-text">
                        <h2>QUIZ</h2>
                        <p>Nehmen Sie an unserem Quiz teil und gewinnen Sie tolle Preise und Geschenke.</p>
                    </div>
                </article>
            </button>

        </section>

        <footer class="site-footer">
            <p>&copy; 2026 FIFA. Akademisches Projekt - Alle Rechte vorbehalten.</p>
        </footer>

    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const watchButton = document.getElementById('watch-teaser');
            const videoContainer = document.getElementById('video-container');
            const videoFrame = document.getElementById('teaser-video');
            const videoUrl = 'https://www.youtube.com/embed/ZTdOX1U2K0Q?si=totFBb63-wIMbT6p';
            let open = false;

            watchButton?.addEventListener('click', () => {
                if (!videoFrame || !videoContainer) return;

                open = !open;
                if (open) {
                    videoFrame.src = videoUrl;
                    videoContainer.hidden = false;
                    videoContainer.classList.add('active');
                    watchButton.textContent = 'FERMER TEASER';
                } else {
                    videoFrame.src = '';
                    videoContainer.hidden = true;
                    videoContainer.classList.remove('active');
                    watchButton.innerHTML = '<span class="icon">▶</span> WATCH TEASER';
                }
            });
        });
    </script>

</body>
</html>
