<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanshop - Coupe du Monde 2026</title>
    <link rel="stylesheet" href="fans.css"> </head>
<body>

    <div class="grid-container">
        <main class="main-content">
            <section class="shop-section">
                <h2>Boutique Officielle 2026</h2>
                
                <div class="shop-grid">
                    <div class="product-card">
                        <div class="product-image">
                            <img src="img/ballon-officiel.jpg" alt="Ballon Officiel Coupe du Monde 2026">
                        </div>
                        <div class="product-info">
                            <span class="product-category">Équipement</span>
                            <h3>Ballon Officiel Match</h3>
                            <p class="product-price">140,00 €</p>
                            <button class="btn-buy">Acheter</button>
                        </div>
                    </div>

                    <div class="product-card">
                        <div class="product-image">
                            <img src="img/maillot-mexique.jpg" alt="Maillot Mexique 2026">
                        </div>
                        <div class="product-info">
                            <span class="product-category">Vêtements</span>
                            <h3>Maillot Domicile Mexique</h3>
                            <p class="product-price">90,00 €</p>
                            <button class="btn-buy">Acheter</button>
                        </div>
                    </div>

                    <div class="product-card">
                        <div class="product-image">
                            <img src="img/casquette-usa.jpg" alt="Casquette USA 2026">
                        </div>
                        <div class="product-info">
                            <span class="product-category">Accessoires</span>
                            <h3>Casquette Officielle USA</h3>
                            <p class="product-price">30,00 €</p>
                            <button class="btn-buy">Acheter</button>
                        </div>
                    </div>

                    <div class="product-card">
                        <div class="product-image">
                            <img src="img/echarpe-vancouver.jpg" alt="Écharpe Vancouver 2026">
                        </div>
                        <div class="product-info">
                            <span class="product-category">Accessoires</span>
                            <h3>Écharpe Canada - Match</h3>
                            <p class="product-price">25,00 €</p>
                            <button class="btn-buy">Acheter</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        </div>

</body>
</html>
